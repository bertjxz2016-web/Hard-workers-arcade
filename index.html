<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="rewards.css" />
  <style>
    .modal[hidden]{display:none!important}.modal-box{max-height:96vh;overflow:auto}.game-bar{display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:11px;letter-spacing:1px;margin-bottom:8px}.game-bar b{color:#f15b35}.canvas{touch-action:none}.mine-board{display:grid;grid-template-columns:repeat(9,38px);gap:3px;justify-content:center;margin:18px auto}.mine-cell{width:38px;height:38px;border:2px outset #eee;background:#b4a6d5;font-weight:800;font-size:17px;cursor:pointer}.mine-cell.open{border:1px solid #aaa;background:#e8e2d8}.board-2048{width:340px;height:340px;aspect-ratio:1/1;margin:18px auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;background:#8d8274;padding:8px;position:relative}.tile{display:grid;place-items:center;aspect-ratio:1/1;min-width:0;min-height:0;background:#c9c0b4;border-radius:4px;font:bold 23px 'DM Sans';color:#17221f}.t2,.t4{background:#efe4cb}.t8,.t16{background:#f2a45e;color:white}.t32,.t64{background:#f15b35;color:white}.t128,.t256,.t512,.t1024,.t2048{background:#ffc857}.overlay-2048{position:absolute;inset:0;background:#17221fcc;color:white;display:grid;place-items:center;font:20px 'Press Start 2P'}.reset{margin-top:8px}@media(max-width:500px){.modal-box{padding:30px 12px}.mine-board{grid-template-columns:repeat(9,31px)}.mine-cell{width:31px;height:31px}.board-2048{width:292px;height:292px}.game-bar{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">EST. 1981 · INSERT COIN</div>
      <h1>PIXEL<br><span>PARTY</span></h1>
      <p>A little corner of the internet for big game energy.</p>
      <div class="hero-controls"><span class="dot"></span> 6 GAMES READY TO PLAY <span class="slash">/</span> PICK YOUR PLAYER</div>
    </header>
    <section class="games" aria-label="Arcade games">
      <button class="card snake" data-game="snake"><span class="art">🐍</span><span class="label">SNAKE</span><small>GROW · DODGE · REPEAT</small></button>
      <button class="card tetris" data-game="tetris"><span class="art">🧱</span><span class="label">TETRIS</span><small>STACK IT UP</small></button>
      <button class="card breaker" data-game="breaker"><span class="art">◉</span><span class="label">BLOCK BREAKER</span><small>BOUNCE TO WIN</small></button>
      <button class="card two048" data-game="2048"><span class="art">2048</span><span class="label">2048</span><small>MERGE YOUR WAY UP</small></button>
      <button class="card mines" data-game="mines"><span class="art">💣</span><span class="label">MINESWEEPER</span><small>LUCK · LOGIC · GLORY</small></button>
      <button class="card pacman" data-game="pacman"><span class="art">◕</span><span class="label">PAC-MAN</span><small>WAKA WAKA</small></button>
    </section>
    <footer><span>© PIXEL PARTY</span><span>NO HIGH SCORE TOO HIGH</span><span>♥ HAVE FUN</span></footer>
  </main>
  <div class="modal" id="modal" hidden><div class="modal-box"><button class="close" id="close">×</button><div id="game"></div></div></div>
  <script src="script.js"></script>
  <script src="pacman.js"></script>
  <script src="levels.js"></script>
  <script src="tetris-fix.js"></script>
  <script src="game-cleanup.js"></script>
  <script src="rewards.js"></script>
</body>
</html>
